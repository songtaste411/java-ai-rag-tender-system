# 招投标 RAG —— Docker Compose（第 3 层：容器编排）
# 用法见 docs/03-compose.md
# 仅起基础设施（第 1 层本地开发）：docker compose up -d etcd minio standalone redis ollama

services:
  etcd:
    container_name: milvus-etcd
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ETCDCTL_API: "3"
      ETCD_UNSUPPORTED_ARCH: amd64
    volumes:
      - ./volumes/etcd:/etcd
    ports:
      - "2379:2379"
    command:
      - /usr/local/bin/etcd
      - --name=milvus-etcd
      - --data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://milvus-etcd:2380
      - --initial-cluster=milvus-etcd=http://milvus-etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-token
    networks: [rag]
    user: "root"

  minio:
    container_name: milvus-minio
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /minio_data --address ":9000" --console-address ":9001"
    networks: [rag]
    user: "root"
    restart: always

  standalone:
    container_name: milvus-standalone
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/milvusdb/milvus:v2.5.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on: [etcd, minio]
    networks: [rag]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  redis:
    container_name: redis
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/opstree/redis:v7.0.5
    ports:
      # 宿主机用 6380，避免和本机其它 Redis 抢 6379；容器内仍是 6379
      - "6380:6379"
    volumes:
      - ./volumes/redis:/data
    networks: [rag]
    restart: always

  ollama:
    container_name: ollama
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/ollama/ollama:0.30.2
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # 镜像 ENTRYPOINT 已是 ollama，这里只能写 serve
    command: ["serve"]
    networks: [rag]
    restart: always

  # —— 业务：解析（只抽文本）——
  doc-parser:
    container_name: doc-parser
    build: ./document-parser
    image: rag-doc-parser:latest
    ports:
      - "9099:9099"
    depends_on: [ollama]
    networks: [rag]
    restart: always

  # —— 业务：RAG API + 网页 ——
  rag-api:
    container_name: rag-api
    build: .
    image: rag-api:latest
    ports:
      # 宿主机 18081，避免本机 8081 被占用/保留；容器内仍是 8081
      - "18081:8081"
    environment:
      PARSER_BASE_URL: http://doc-parser:9099
      OLLAMA_BASE_URL: http://ollama:11434
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: "19530"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OLLAMA_CHAT_MODEL: deepseek-r1
      OLLAMA_EMBED_MODEL: bge-m3
    depends_on:
      - doc-parser
      - standalone
      - ollama
      - redis
    networks: [rag]
    restart: always

networks:
  rag:
    name: rag
    driver: bridge

volumes:
  ollama_data:
