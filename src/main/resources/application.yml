server:
  port: ${SERVER_PORT:8081}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:deepseek-r1}
        options:
          timeout: 180000
          connect-timeout: 30000
          read-timeout: 180000
      embedding:
        model: ${OLLAMA_EMBED_MODEL:bge-m3}
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database: default
        collection-name: ${MILVUS_COLLECTION:rag_kb_v2}
        initialize-schema: true
        embedding-dimension: 1024
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Python 解析服务地址（本地 / Docker / K8s 用环境变量覆盖）
app:
  parser:
    base-url: ${PARSER_BASE_URL:http://127.0.0.1:9099}
