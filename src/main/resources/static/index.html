<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文档导入 - 招投标 RAG</title>
  <style>
    body { margin: 24px; font-family: sans-serif; max-width: 920px; }
    .nav a { margin-right: 16px; }
    .item { margin: 12px 0; }
    button { padding: 8px 16px; cursor: pointer; }
    textarea { width: 100%; height: 220px; box-sizing: border-box; }
    #tip { color: #555; }
  </style>
</head>
<body>
<div class="nav">
  <a href="/index.html"><b>文档导入</b></a>
  <a href="/chat.html">知识库问答</a>
</div>
<h3>文档导入（解析 → 分块 → 向量入库）</h3>
<p>统一入口：Java API。Python 只负责抽文本。</p>
<div class="item">窗口 <input id="win" type="number" value="800" style="width:70px">
  重叠 <input id="ov" type="number" value="150" style="width:70px">
  章节最小 <input id="cm" type="number" value="300" style="width:70px"></div>
<div class="item"><input id="file" type="file" accept=".pdf,.docx,.txt,.md"></div>
<div class="item"><button onclick="upload()">开始导入</button></div>
<p id="tip"></p>
<textarea id="out" readonly placeholder="分块预览..."></textarea>
<script>
async function upload() {
  const tip = document.getElementById('tip');
  const out = document.getElementById('out');
  const f = document.getElementById('file').files[0];
  if (!f) { tip.innerText = '请先选文件'; return; }
  tip.innerText = '导入中（大文件可能较久）...';
  out.value = '';
  const fd = new FormData();
  fd.append('file', f);
  fd.append('window_size', document.getElementById('win').value);
  fd.append('overlap_size', document.getElementById('ov').value);
  fd.append('chapter_min_len', document.getElementById('cm').value);
  try {
    const res = await fetch('/api/documents/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.code === 0) {
      tip.innerText = `成功：${data.filename}，约 ${data.chars} 字，${data.chunkCount} 块`;
      out.value = (data.chunks || []).join('\n--------\n');
    } else {
      tip.innerText = '失败：' + data.msg;
    }
  } catch (e) {
    tip.innerText = '请求失败：' + e;
  }
}
</script>
</body>
</html>
