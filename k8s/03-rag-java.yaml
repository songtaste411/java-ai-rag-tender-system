# Java RAG API + 网页；Milvus/Redis 走宿主机 Compose
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-java
  namespace: rag-tender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-java
  template:
    metadata:
      labels:
        app: rag-java
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames: ["host.docker.internal"]
      containers:
        - name: rag-java
          image: rag-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: PARSER_BASE_URL
              value: http://doc-parser.rag-tender.svc.cluster.local:9099
            - name: OLLAMA_BASE_URL
              value: http://ollama.rag-tender.svc.cluster.local:11434
            - name: MILVUS_HOST
              value: host.docker.internal
            - name: MILVUS_PORT
              value: "19530"
            - name: REDIS_HOST
              value: host.docker.internal
            - name: REDIS_PORT
              value: "6380"
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-java
  namespace: rag-tender
spec:
  type: NodePort
  selector:
    app: rag-java
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
