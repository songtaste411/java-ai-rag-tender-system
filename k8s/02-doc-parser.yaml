# 只解析，不连 Milvus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-parser
  namespace: rag-tender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doc-parser
  template:
    metadata:
      labels:
        app: doc-parser
    spec:
      containers:
        - name: doc-parser
          image: rag-doc-parser:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9099
          readinessProbe:
            httpGet:
              path: /health
              port: 9099
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: doc-parser
  namespace: rag-tender
spec:
  type: NodePort
  selector:
    app: doc-parser
  ports:
    - port: 9099
      targetPort: 9099
      nodePort: 30099
